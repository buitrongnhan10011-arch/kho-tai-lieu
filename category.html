<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài liệu học tập</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .password-box {
            max-width: 420px;
            margin: 25px auto;
            padding: 24px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            text-align: center;
        }

        .password-box input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .password-box button {
            padding: 11px 22px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        .password-box button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #password-message {
            margin-top: 12px;
            color: #dc2626;
        }

        /* NÚT XEM TRƯỚC VÀ TẢI XUỐNG */

        .document-actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 18px;
        }

        .document-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 43px;
            padding: 10px 20px;
            font-family: 'Be Vietnam Pro', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            background: #080808;
            border: 1px solid #ffffff;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .document-button:hover {
            background: #ffffff;
            color: #050505;
            border-color: #ffffff;
            transform: translateY(-4px);
            box-shadow:
                0 0 8px rgba(255,255,255,0.35),
                0 0 20px rgba(255,255,255,0.15);
        }

        .document-button:active {
            transform: translateY(-1px) scale(0.97);
        }

        .document-button:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 4px;
        }

        /* CỬA SỔ XEM TRƯỚC */

        .preview-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            display: none;
            padding: 20px;
            box-sizing: border-box;
        }

        .preview-overlay.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-window {
            width: min(1100px, 100%);
            height: min(90vh, 900px);
            background: white;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .preview-header {
            min-height: 55px;
            padding: 10px 15px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 1px solid #ddd;
        }

        .preview-header strong {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #111;
        }

        .preview-close {
            border: none;
            background: #dc2626;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .preview-close:hover {
            background: #b91c1c;
        }

        .preview-content {
            flex: 1;
            overflow: auto;
            background: #f3f4f6;
            padding: 20px;
            box-sizing: border-box;
        }

        .preview-content iframe {
            width: 100%;
            height: 100%;
            min-height: 650px;
            border: none;
            background: white;
        }

        .preview-content img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 0 auto;
        }

        .docx-preview {
            max-width: 850px;
            min-height: 100%;
            margin: 0 auto;
            padding: 45px;
            background: white;
            box-sizing: border-box;
            line-height: 1.6;
            color: #111;
            overflow-wrap: break-word;
        }

        .docx-preview img {
            max-width: 100%;
            height: auto;
        }

        .docx-preview table {
            max-width: 100%;
            border-collapse: collapse;
        }

        .docx-preview td,
        .docx-preview th {
            border: 1px solid #ccc;
            padding: 6px;
        }

        .preview-loading {
            text-align: center;
            padding: 40px;
            color: #555;
        }

        .preview-error {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            color: #b91c1c;
            text-align: center;
        }

        @media (max-width: 600px) {
            .preview-overlay {
                padding: 5px;
            }

            .preview-window {
                height: 96vh;
            }

            .preview-content {
                padding: 10px;
            }

            .docx-preview {
                padding: 20px;
            }

            .document-actions {
                gap: 8px;
            }

            .document-button {
                flex: 1;
                min-width: 0;
                padding: 10px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-content">
        <h1 id="category-title">Đang tải...</h1>
        <p>Kho lưu trữ tài liệu</p>
    </div>
</header>

<main>
    <section class="intro">
        <h2 id="section-title">Danh sách tài liệu</h2>
        <p id="section-description">Các tài liệu được lưu trữ tại đây.</p>
    </section>

    <section id="document-list" class="categories"></section>

    <a href="index.html" class="back-button">← Quay lại trang chủ</a>
</main>

<footer>
    <p>© 2026 KHO TÀI LIỆU</p>
    <p>Không gian chia sẻ kiến thức</p>
    <p class="developer">Developed by TN</p>
</footer>

<!-- CỬA SỔ XEM TRƯỚC -->

<div id="preview-overlay" class="preview-overlay">
    <div class="preview-window">

        <div class="preview-header">
            <strong id="preview-title">Xem trước tài liệu</strong>

            <button type="button" id="preview-close" class="preview-close">
                Đóng
            </button>
        </div>

        <div id="preview-content" class="preview-content"></div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>

<script>
    const SUPABASE_URL = "https://axmgzhcozkwekjxbofoh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_SQPDN_7N8IBG92iMWFSQ4A_3PYj9ykP";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    const params = new URLSearchParams(window.location.search);
    const folder = params.get("folder");

    const title = document.getElementById("category-title");
    const list = document.getElementById("document-list");

    const sectionTitle = document.getElementById("section-title");
    const sectionDescription = document.getElementById("section-description");

    const previewOverlay = document.getElementById("preview-overlay");
    const previewTitle = document.getElementById("preview-title");
    const previewContent = document.getElementById("preview-content");
    const previewClose = document.getElementById("preview-close");


    /* HIỂN THỊ THÔNG BÁO */

    function showMessage(message) {
        list.textContent = message;
    }


    /* NHẬN DIỆN ĐỊNH DẠNG TỆP */

    function getFileExtension(doc) {
        const sources = [
            doc.storage_path,
            doc.file_url,
            doc.file_type,
            doc.title
        ];

        for (const source of sources) {
            if (!source) continue;

            let value = String(source);

            try {
                value = decodeURIComponent(value);
            } catch (e) {
                // Giữ nguyên nếu không giải mã được
            }

            value = value
                .split("?")[0]
                .split("#")[0]
                .toLowerCase();

            // Nhận diện qua MIME type

            if (
                value.includes("wordprocessingml.document") ||
                value.includes("application/vnd.openxmlformats")
            ) {
                return "docx";
            }

            if (value.includes("application/pdf")) {
                return "pdf";
            }

            // Nhận diện qua đuôi tệp

            const match = value.match(
                /\.(docx|doc|pdf|jpg|jpeg|png|gif|webp)$/i
            );

            if (match) {
                return match[1].toLowerCase();
            }
        }

        return "";
    }


    /* HIỂN THỊ LỖI XEM TRƯỚC */

    function showPreviewError(message) {
        previewContent.innerHTML = "";

        const errorBox = document.createElement("div");
        errorBox.className = "preview-error";
        errorBox.textContent = message;

        previewContent.appendChild(errorBox);
    }


    /* XEM TRƯỚC TÀI LIỆU */

    async function openPreview(doc) {
        previewOverlay.classList.add("active");

        previewTitle.textContent =
            doc.title || "Xem trước tài liệu";

        previewContent.innerHTML =
            '<div class="preview-loading">Đang tải bản xem trước...</div>';

        const fileUrl = doc.file_url;
        const extension = getFileExtension(doc);

        if (!fileUrl) {
            showPreviewError(
                "Không tìm thấy đường dẫn tài liệu."
            );
            return;
        }

        console.log("Thông tin tài liệu:", doc);
        console.log("Định dạng nhận diện:", extension);


        /* XEM TRƯỚC HÌNH ẢNH */

        if (
            ["jpg", "jpeg", "png", "gif", "webp"].includes(extension)
        ) {
            const image = document.createElement("img");

            image.src = fileUrl;
            image.alt = doc.title || "Hình ảnh tài liệu";

            image.onload = function () {
                previewContent.innerHTML = "";
                previewContent.appendChild(image);
            };

            image.onerror = function () {
                showPreviewError(
                    "Không thể hiển thị hình ảnh. Vui lòng kiểm tra đường dẫn tệp."
                );
            };

            return;
        }


        /* XEM TRƯỚC PDF */

        if (extension === "pdf") {
            const iframe = document.createElement("iframe");

            iframe.src = fileUrl;
            iframe.title = "Xem trước PDF";

            previewContent.innerHTML = "";
            previewContent.appendChild(iframe);

            return;
        }


        /* XEM TRƯỚC WORD DOCX */

        if (extension === "docx") {
            try {
                if (typeof mammoth === "undefined") {
                    throw new Error(
                        "Không tải được thư viện xem trước Word."
                    );
                }

                const response = await fetch(fileUrl);

                if (!response.ok) {
                    throw new Error(
                        "Không thể tải tài liệu Word. Mã lỗi HTTP: " +
                        response.status
                    );
                }

                const arrayBuffer = await response.arrayBuffer();

                const result = await mammoth.convertToHtml(
                    {
                        arrayBuffer: arrayBuffer
                    },
                    {
                        includeDefaultStyleMap: true
                    }
                );

                previewContent.innerHTML = "";

                const article = document.createElement("article");
                article.className = "docx-preview";

                article.innerHTML = result.value;

                previewContent.appendChild(article);

                if (result.messages && result.messages.length > 0) {
                    console.warn(
                        "Một số nội dung Word không được chuyển đổi:",
                        result.messages
                    );
                }

            } catch (error) {
                console.error("Lỗi xem trước DOCX:", error);

                showPreviewError(
                    "Không thể xem trước file Word. " +
                    "Có thể đường dẫn tệp không hợp lệ, " +
                    "tệp không tồn tại hoặc máy chủ chưa cho phép tải tệp."
                );
            }

            return;
        }


        /* ĐỊNH DẠNG CHƯA HỖ TRỢ */

        showPreviewError(
            "Định dạng này chưa hỗ trợ xem trước. Bạn có thể sử dụng nút Tải xuống."
        );
    }


    /* ĐÓNG CỬA SỔ XEM TRƯỚC */

    function closePreview() {
        previewOverlay.classList.remove("active");
        previewContent.innerHTML = "";
    }

    previewClose.addEventListener("click", closePreview);

    previewOverlay.addEventListener("click", function (event) {
        if (event.target === previewOverlay) {
            closePreview();
        }
    });

    document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
            closePreview();
        }

        if (
            previewOverlay.classList.contains("active") &&
            (event.ctrlKey || event.metaKey) &&
            event.key.toLowerCase() === "c"
        ) {
            event.preventDefault();
        }
    });


    /* HẠN CHẾ SAO CHÉP TRONG KHUNG XEM TRƯỚC */

    previewContent.addEventListener("contextmenu", function (event) {
        event.preventDefault();
    });

    previewContent.addEventListener("copy", function (event) {
        event.preventDefault();
    });

    previewContent.addEventListener("cut", function (event) {
        event.preventDefault();
    });

    previewContent.addEventListener("selectstart", function (event) {
        event.preventDefault();
    });


    /* HIỂN THỊ DANH SÁCH TÀI LIỆU */

    function renderDocuments(documents) {
        list.innerHTML = "";

        if (!documents || documents.length === 0) {
            showMessage("Danh mục này chưa có tài liệu.");
            return;
        }

        documents.forEach(function (doc) {
            const card = document.createElement("div");
            card.className = "category-card";

            const info = document.createElement("div");

            const heading = document.createElement("h3");
            heading.textContent = doc.title || "Tài liệu không có tên";

            const actions = document.createElement("div");
            actions.className = "document-actions";


            /* NÚT XEM TRƯỚC */

            const preview = document.createElement("button");

            preview.type = "button";
            preview.textContent = "👁 Xem trước";
            preview.className = "document-button preview-button";

            preview.addEventListener("click", function () {
                openPreview(doc);
            });


            /* NÚT TẢI XUỐNG */

            const download = document.createElement("a");

            download.href = doc.file_url;
            download.textContent = "⬇ Tải xuống";
            download.className = "document-button download-button";
            download.target = "_blank";
            download.rel = "noopener noreferrer";
            download.download = "";

            actions.appendChild(preview);
            actions.appendChild(download);

            info.appendChild(heading);
            info.appendChild(actions);

            card.appendChild(info);

            list.appendChild(card);
        });
    }


    /* FORM NHẬP MẬT KHẨU */

    function showPasswordForm(categoryId) {
        list.innerHTML = "";

        sectionTitle.textContent = "Danh mục được bảo vệ";

        sectionDescription.textContent =
            "Vui lòng nhập mật khẩu để xem tài liệu.";

        const box = document.createElement("div");
        box.className = "password-box";

        const heading = document.createElement("h3");
        heading.textContent = "🔒 Nhập mật khẩu";

        const input = document.createElement("input");

        input.type = "password";
        input.placeholder = "Nhập mật khẩu danh mục";
        input.autocomplete = "current-password";

        const button = document.createElement("button");

        button.type = "button";
        button.textContent = "Mở khóa";

        const message = document.createElement("p");
        message.id = "password-message";

        box.appendChild(heading);
        box.appendChild(input);
        box.appendChild(button);
        box.appendChild(message);

        list.appendChild(box);


        /* XÁC THỰC MẬT KHẨU */

        async function verifyPassword() {
            const password = input.value;

            if (!password) {
                message.textContent = "Vui lòng nhập mật khẩu.";
                return;
            }

            button.disabled = true;
            message.textContent = "Đang xác thực...";

            try {
                const result =
                    await supabaseClient.functions.invoke(
                        "dynamic-responder",
                        {
                            body: {
                                action: "verify",
                                category_id: categoryId,
                                password: password
                            }
                        }
                    );

                const data = result.data;
                const error = result.error;

                if (error) {
                    throw error;
                }

                if (!data || !data.success) {
                    message.textContent =
                        data?.error || "Mật khẩu không đúng.";

                    return;
                }

                sectionTitle.textContent = "Danh sách tài liệu";

                sectionDescription.textContent =
                    "Bạn đã mở khóa danh mục thành công.";

                renderDocuments(data.documents || []);

            } catch (error) {
                console.error("Lỗi xác thực:", error);

                let detail =
                    error.message || "Lỗi không xác định";

                if (error.context) {
                    try {
                        const response =
                            await error.context.json();

                        detail =
                            response.error ||
                            JSON.stringify(response);

                    } catch (e) {
                        // Giữ lỗi ban đầu
                    }
                }

                message.textContent = "Lỗi: " + detail;

            } finally {
                button.disabled = false;
            }
        }

        button.addEventListener("click", verifyPassword);

        input.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                verifyPassword();
            }
        });
    }


    /* TẢI DANH MỤC VÀ TÀI LIỆU */

    async function loadDocuments() {
        list.textContent = "Đang tải danh mục...";

        if (!folder) {
            title.textContent = "Không tìm thấy danh mục";

            showMessage("Vui lòng quay lại trang chủ.");

            return;
        }

        try {
            const result =
                await supabaseClient
                    .from("categories")
                    .select("id, name, requires_password")
                    .eq("slug", folder)
                    .maybeSingle();

            const category = result.data;
            const categoryError = result.error;

            if (categoryError || !category) {
                console.error(categoryError);

                title.textContent = "Không tìm thấy danh mục";

                showMessage("Danh mục không tồn tại.");

                return;
            }

            title.textContent = category.name.toUpperCase();


            /* DANH MỤC CÓ MẬT KHẨU */

            if (category.requires_password) {
                showPasswordForm(category.id);
                return;
            }


            /* DANH MỤC CÔNG KHAI */

            sectionTitle.textContent = "Danh sách tài liệu";

            sectionDescription.textContent =
                "Các tài liệu được lưu trữ tại đây.";

            const documentResult =
                await supabaseClient
                    .from("documents")
                    .select("*")
                    .eq("category_id", category.id)
                    .order("created_at", {
                        ascending: false
                    });

            const documents = documentResult.data;
            const error = documentResult.error;

            if (error) {
                console.error(error);

                showMessage("Không thể tải danh sách tài liệu.");

                return;
            }

            renderDocuments(documents);

        } catch (error) {
            console.error("Lỗi tải danh mục:", error);

            showMessage(
                "Đã xảy ra lỗi khi tải danh mục. Vui lòng thử lại."
            );
        }
    }


    /* KHỞI CHẠY */

    loadDocuments();

</script>

</body>
</html>
