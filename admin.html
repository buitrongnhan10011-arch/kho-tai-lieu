<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Kho tài liệu</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .admin-box {
            max-width: 420px;
            margin: 70px auto;
            padding: 35px;
            background: #151515;
            border: 1px solid #333;
            border-radius: 14px;
        }

        .admin-box h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .admin-box input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .admin-box button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: white;
            color: black;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            color: #ff7777;
        }
    </style>
</head>

<body>

    <header>
        <div class="header-content">
            <h1>ADMIN</h1>
            <p>Quản trị kho tài liệu học tập</p>
        </div>
    </header>

    <main>
        <div class="admin-box">
            <h2>ĐĂNG NHẬP</h2>

            <form id="login-form">
                <input
                    type="email"
                    id="email"
                    placeholder="Email Admin"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Mật khẩu"
                    required
                >

                <button type="submit">Đăng nhập</button>
            </form>

            <p id="message"></p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://axmgzhcozkwekjxbofoh.supabase.co";

        const SUPABASE_KEY = "sb_publishable_SQPDN_7N8IBG92iMWFSQ4A_3PYj9ykP";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        const ADMIN_UID = "1ec8a1fa-7f6f-4626-9890-84aee80f2f4b";

        document.getElementById("login-form").addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            message.textContent = "Đang đăng nhập...";

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                message.textContent = "Email hoặc mật khẩu không chính xác.";
                return;
            }

            if (data.user.id !== ADMIN_UID) {
                await supabaseClient.auth.signOut();
                message.textContent = "Tài khoản không có quyền Admin.";
                return;
            }

            message.textContent = "Đăng nhập thành công!";

            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 1000);
        });
    </script>

</body>
</html>
